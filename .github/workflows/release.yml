name: Release

# Every push to main ships a new minor version of the plugin. The bump commit
# is pushed with GITHUB_TOKEN, which does not trigger workflows, so this does
# not loop; the `if` below guards against it anyway.

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Bump version
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Bump minor version
        working-directory: crates/skillset
        run: echo "VERSION=$(bun run --silent skillset.bump)" >> "$GITHUB_ENV"

      - name: Commit, tag, and push
        run: 'test -n "$VERSION" && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -am "chore: release v$VERSION" && git tag "v$VERSION" && git push origin HEAD:main "v$VERSION"'
